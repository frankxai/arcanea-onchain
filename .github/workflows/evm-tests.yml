name: EVM Tests

on:
  push:
    branches: [main]
    paths:
      - 'contracts/evm/**'
      - '.gitmodules'
      - '.github/workflows/evm-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/evm/**'
      - '.gitmodules'
      - '.github/workflows/evm-tests.yml'
  workflow_dispatch:

jobs:
  foundry-test:
    name: Foundry Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Run Foundry tests
        working-directory: contracts/evm
        run: forge test -vvv

      - name: Check formatting
        working-directory: contracts/evm
        run: forge fmt --check
