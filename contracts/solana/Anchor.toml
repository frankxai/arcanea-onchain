[features]
resolution = true
skip-lint = false

# Placeholder IDs matching each program's declare_id!. They have never been
# deployed. CI runs `anchor keys sync` against throwaway keypairs before
# `anchor test`; real deployment keys are a release decision, not a test input.
[programs.localnet]
academy_badge = "AcdBdg1111111111111111111111111111111111111"
guardian_nft = "GrdNFT1111111111111111111111111111111111111"
guardian_vault = "GrdVLt1111111111111111111111111111111111111"
rewards = "RwdPgm1111111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 'tests/**/*.ts'"
